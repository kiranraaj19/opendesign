[package]
name = "od_app"
description = "OpenDesign desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opendesign"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui_dock = { version = "0.21.1", features = ["serde"] }
od_core = { path = "../od_core" }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
