[package]
name = "od_app"
description = "OpenDesign desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opendesign"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui_dock = { version = "0.21.1", features = ["serde"] }
od_core = { path = "../od_core" }
od_render = { path = "../od_render" }
od_sim = { path = "../od_sim" }
printpdf = { version = "0.12.8", default-features = false }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
