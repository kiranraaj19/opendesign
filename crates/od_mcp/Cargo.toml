[package]
name = "od_mcp"
description = "OpenDesign MCP server: lets an AI assistant design, drape and render garments"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opendesign-mcp"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
od_core = { path = "../od_core" }
od_render = { path = "../od_render" }
od_sim = { path = "../od_sim" }
pollster = "0.4"
serde_json = "1"
